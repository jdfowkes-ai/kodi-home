name: Build Kodi Home Add-on

on:
  workflow_dispatch:
  push:
    paths:
      - "addon/**"
      - 'scripts/normalize_app_logos.py'
      - ".github/workflows/build-kodi-home-addon.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kodi Home
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m compileall -q addon scripts tools
      - name: Test launcher migration and ordering
        run: |
          python3 - <<'PY'
          import sys, types, tempfile
          from pathlib import Path
          sys.modules["xbmcaddon"] = types.ModuleType("xbmcaddon")
          sys.modules["xbmcvfs"] = types.ModuleType("xbmcvfs")
          sys.path.insert(0, "addon/resources/lib")
          from kodihome.store import LocalStore
          with tempfile.TemporaryDirectory() as tmp:
              store = LocalStore.__new__(LocalStore)
              store.path = Path(tmp) / "test.sqlite3"
              store.launcher_state(1, "hub:movies", label="My films")
              store.launcher_state(1, "hub:movies", opened=True)
              before = store.launcher_state(1)["hub:movies"]
              store.migrate_launcher_shortcut(1, "hub:movies", "hub:1101")
              state = store.launcher_state(1)
              assert "hub:movies" not in state
              assert state["hub:1101"]["label"] == "My films"
              assert state["hub:1101"]["opened_at"] == before["opened_at"]
              store.migrate_launcher_shortcut(1, "hub:movies", "hub:1101")
              assert store.launcher_state(1) == state
              store.launcher_state(2, "hub:movies", label="Other group")
              store.launcher_state(1, "app:example", opened=True)
              assert store.launcher_state(1)["app:example"]["opened_at"] >= before["opened_at"]
              assert store.launcher_state(2)["hub:movies"]["label"] == "Other group"
          PY
      - name: Normalize launcher artwork
        run: |
          python3 -m pip install Pillow CairoSVG
          python3 scripts/normalize_app_logos.py
      - name: Package installable add-on
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("addon")
          metadata = ElementTree.parse(source / "addon.xml").getroot()
          addon_id = metadata.attrib["id"]
          version = metadata.attrib["version"]
          output = Path("dist") / f"{addon_id}-{version}.zip"
          output.parent.mkdir(parents=True, exist_ok=True)

          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file() and ".git" not in path.parts:
                      archive.write(path, Path(addon_id) / path.relative_to(source))

          print(f"Created {output}")
          PY

      - name: Upload installable add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin.video.kodihome
          path: dist/plugin.video.kodihome-*.zip
          if-no-files-found: error
