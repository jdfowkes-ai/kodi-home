name: Publish Kodi Home add-on repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "addon/**"
      - "skin/**"
      - "tools/apply_skin_overlay.py"
      - "tools/build_kodi_repository.py"
      - ".github/workflows/publish-kodi-repository.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kodi-home-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kodi Home
        uses: actions/checkout@v4

      - name: Check out the pinned Arctic Fuse 3.4.18 source
        uses: actions/checkout@v4
        with:
          repository: jurialmunkey/skin.arctic.fuse.3
          ref: 4199a3fb1f0f37e4803d94d5238361596298a715
          path: upstream/skin.arctic.fuse.3

      - name: Apply the Kodi Home skin overlay
        run: python3 tools/apply_skin_overlay.py upstream/skin.arctic.fuse.3

      - name: Build Kodi repository site
        run: python3 tools/build_kodi_repository.py site upstream/skin.arctic.fuse.3

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
